<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>급똥 로고 원본 v1</title><style>*{box-sizing:border-box}body{margin:0;background:#F6F8F5;color:#153B2B;font:15px/1.6 "Malgun Gothic",sans-serif}main{max-width:1080px;margin:auto;padding:32px 24px}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #D9E2D8;padding-bottom:20px}h1{margin:0;font-size:23px}h2{font-size:16px;font-weight:500;margin:24px 0 12px}button,a{font:inherit;color:inherit}button{background:#fff;border:1px solid #C7D5C9;border-radius:8px;padding:8px 12px;cursor:pointer}.layout{display:grid;grid-template-columns:1fr 1.55fr;gap:28px;align-items:center;padding:40px 0}.surface{background:#fff;border-radius:24px;padding:30px;min-height:280px;display:grid;place-items:center}.symbol{width:260px;max-width:100%}.lockups{display:grid;gap:36px}.lockups img{width:100%;max-width:520px}.icons{display:flex;align-items:center;gap:32px;flex-wrap:wrap}.app{width:144px;display:block;border-radius:22.2%}.circle{border-radius:50%}.sizes{display:flex;align-items:center;gap:28px;flex-wrap:wrap}.sizes figure{margin:0;text-align:center}.sizes img{display:block;border-radius:21%;margin-bottom:8px}.files{display:flex;gap:20px;flex-wrap:wrap;margin-top:26px}.dark{background:#112B20;color:#fff}.dark .surface{background:#214335}.dark header{border-color:#3A5A45}.dark button{background:#214335;color:#fff;border-color:#3A5A45}.dark .symbol{content:url('../svg/symbol-white.svg')}.dark .ko{content:url('../svg/lockup-ko-white.svg')}.dark .en{content:url('../svg/lockup-en-white.svg')}@media(max-width:650px){.layout{grid-template-columns:1fr}.surface{min-height:230px}.symbol{width:210px}.app{width:108px}.icons{gap:18px}}
</style></head><body><main><header><h1>급똥 · Hangul Point 원본 v1</h1><button id="appearance" type="button" aria-pressed="false">어두운 배경</button></header><div class="layout"><div class="surface"><img class="symbol" src="../svg/symbol-green.svg" alt="ㄸ, 원점, 위치 포인트를 결합한 급똥 심볼"></div><div class="lockups"><img class="ko" src="../svg/lockup-ko.svg" alt="심볼과 급똥 한글 로고"><img class="en" src="../svg/lockup-en.svg" alt="심볼과 기존 GEUP DDONG 영문 로고"></div></div><h2>앱 아이콘 · 원형 프로필</h2><div class="icons"><img class="app" src="../png/app-icon-1024.png" alt="둥근 사각형 앱 아이콘"><img class="app circle" src="../png/avatar-1080.png" alt="원형 프로필 아이콘"></div><h2>작은 크기</h2><div class="sizes"><figure><img src="../png/favicon-16.png" width="16" height="16" alt="16픽셀 로고"><figcaption>16px</figcaption></figure><figure><img src="../png/favicon-24.png" width="24" height="24" alt="24픽셀 로고"><figcaption>24px</figcaption></figure><figure><img src="../png/favicon-32.png" width="32" height="32" alt="32픽셀 로고"><figcaption>32px</figcaption></figure><figure><img src="../png/favicon-48.png" width="48" height="48" alt="48픽셀 로고"><figcaption>48px</figcaption></figure><figure><img src="../png/favicon-64.png" width="64" height="64" alt="64픽셀 로고"><figcaption>64px</figcaption></figure></div><div class="files"><a href="../svg/symbol-green.svg" download>심볼 SVG</a><a href="../svg/lockup-ko.svg" download>한글 SVG</a><a href="../svg/lockup-en.svg" download>영문 SVG</a><a href="../png/app-icon-1024.png" download>앱 아이콘 PNG</a></div></main><script>document.getElementById('appearance').addEventListener('click',function(){const dark=document.body.classList.toggle('dark');this.setAttribute('aria-pressed',String(dark));this.textContent=dark?'밝은 배경':'어두운 배경'});</script></body></html>
